name: ebmis
region: sgp

services:
  - name: web
    environment_slug: php
    github:
      branch: master
      deploy_on_push: true
      repo: lordreignera/ebmis
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    run_command: heroku-php-apache2 public/
    envs:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: ${APP_KEY}
        type: SECRET
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ${ebims1.HOSTNAME}
      - key: DB_PORT
        value: ${ebims1.PORT}
      - key: DB_DATABASE
        value: ${ebims1.DATABASE}
      - key: DB_USERNAME
        value: ${ebims1.USERNAME}
      - key: DB_PASSWORD
        value: ${ebims1.PASSWORD}
        type: SECRET
      - key: SESSION_SECURE_COOKIE
        value: "true"

# Add this worker component for scheduler
workers:
  - name: scheduler
    environment_slug: php
    github:
      branch: master
      deploy_on_push: true
      repo: lordreignera/ebmis
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: php artisan schedule:work
    envs:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: ${APP_KEY}
        type: SECRET
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ${ebims1.HOSTNAME}
      - key: DB_PORT
        value: ${ebims1.PORT}
      - key: DB_DATABASE
        value: ${ebims1.DATABASE}
      - key: DB_USERNAME
        value: ${ebims1.USERNAME}
      - key: DB_PASSWORD
        value: ${ebims1.PASSWORD}
        type: SECRET
      - key: SESSION_SECURE_COOKIE
        value: "true"

databases:
  - name: ebims1
    engine: MYSQL
    version: "8"
